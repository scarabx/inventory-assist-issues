name: Suggestion
description: An idea for Inventory Assist.
labels: ["suggestion"]
body:
  - type: dropdown
    id: version
    attributes:
      label: Which version of Inventory Assist?
      description: The Minecraft version and mod loader you play Inventory Assist on. It is in the jar's file name.
      options:
        - Fabric 1.20.1
        - Fabric 26.3
    validations:
      required: false
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What it is and how you imagine it working in game.
    validations:
      required: true
